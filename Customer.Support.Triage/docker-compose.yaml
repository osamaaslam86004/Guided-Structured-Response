version: '3.8'

services:
  api:
    build: .
    container_name: ticket_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite:////app/data/tickets.db
    volumes:
      - ./models:/app/models          # Mount GGUF model binary
      - app_data:/app/data            # Persist SQLite DB volume
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ticket_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  app_data:
  redis_data: