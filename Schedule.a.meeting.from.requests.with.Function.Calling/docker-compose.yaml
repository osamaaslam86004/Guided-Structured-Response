services:
  web:
    build: .
    container_name: calendar_fastapi
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GOOGLE_SERVICE_ACCOUNT_FILE=/app/credentials.json
      - GOOGLE_CALENDAR_ID=primary
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./credentials.json:/app/credentials.json
    depends_on:
      - redis

  celery_worker:
    build: .
    container_name: calendar_celery_worker
    command: celery -A tasks.celery_app worker --loglevel=info -c 1
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GOOGLE_SERVICE_ACCOUNT_FILE=/app/credentials.json
      - GOOGLE_CALENDAR_ID=primary
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./credentials.json:/app/credentials.json
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: calendar_redis
    ports:
      - "6379:6379"