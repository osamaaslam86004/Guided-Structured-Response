version: '3.8'

services:
  web:
    build: .
    container_name: sentiment_fastapi
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - redis

  celery_worker:
    build: .
    container_name: sentiment_celery_worker
    command: celery -A tasks.celery_app worker --loglevel=info -c 1
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: sentiment_redis
    ports:
      - "6379:6379"